name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Least privilege: nothing here writes to the repo or publishes anything.
permissions:
  contents: read

# A superseded push stops burning minutes — but never cancel a run on main,
# whose result gates deployment.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: "22"
  # Build-time placeholders. The build must never touch a real project or a
  # paid provider: `generateStaticParams` degrades to an empty city list
  # without Supabase, and the cost guard is cache-only in production unless a
  # live-fetch flag is set, so a CI build makes zero paid calls. Keys are
  # runtime-only by design (Dockerfile / incident action P4).
  NEXT_PUBLIC_SUPABASE_URL: https://example.invalid
  NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder_0000000000
  SUPABASE_SECRET_KEY: sb_secret_ci_placeholder_0000000000
  GOOGLE_PLACES_API_KEY: ci_dummy_places_key
  GOOGLE_GEMINI_API_KEY: ci_dummy_gemini_key
  OPENWEATHERMAP_API_KEY: ci_dummy_openweather_key
  GOOGLE_PLACES_LIVE_FETCH_ENABLED: "false"
  GOOGLE_GEMINI_LIVE_FETCH_ENABLED: "false"

jobs:
  # Fast feedback: everything that needs no build output. Runs first so a
  # typo fails in ~1 minute instead of after a full Next build.
  quality:
    name: Lint, format, types, migrations
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Type check
        run: npm run type-check

      # Static migration policy: RLS + explicit grants per table, no
      # SECURITY DEFINER, pinned search_path, no retired key names. See
      # scripts/check-migrations.ts.
      - name: Migration policy
        run: npm run check:migrations

      # Docker-free: applies every migration + seed to in-process Postgres
      # (PGlite) and runs the pgTAP suite. The `database` job below repeats
      # the pgTAP run against the real Supabase stack.
      - name: Database checks (PGlite)
        run: npm run check:db

  # The authoritative database gate: the real Supabase images (Postgres,
  # Auth, Storage, PostgREST) booted from supabase/config.toml, with the
  # migrations and supabase/seed.sql applied exactly as `supabase db reset`
  # does locally. No hosted project or credential is involved.
  database:
    name: Database (Supabase stack)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      # The Supabase CLI is a pinned devDependency — no third-party action.
      - name: Install dependencies
        run: npm ci

      - name: Start Supabase (applies migrations + seed)
        run: npx supabase start -x realtime,imgproxy,studio,edge-runtime,logflare,vector,supavisor,mailpit

      - name: pgTAP tests
        run: npx supabase test db

      - name: Schema lint
        run: npx supabase db lint --local --level warning --fail-on error

      # The committed src/lib/database.types.ts is kept in the generator's
      # format; compiling the app against freshly generated types proves the
      # code matches the real schema (drift fails here).
      - name: Type-check against generated types
        run: |
          npx supabase gen types --lang=typescript --local --schema public > /tmp/database.types.ts
          cp /tmp/database.types.ts src/lib/database.types.ts
          npx prettier --write src/lib/database.types.ts > /dev/null
          npm run type-check
          git diff --stat -- src/lib/database.types.ts || true

      # End-to-end through the Data API with the local stack's keys: public
      # reads, refused writes, service-only RPCs, storage bucket.
      - name: Smoke test
        run: |
          npx supabase status -o env > /tmp/supabase.env
          set -a; . /tmp/supabase.env; set +a
          echo "::add-mask::$SECRET_KEY"
          NEXT_PUBLIC_SUPABASE_URL="$API_URL" \
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY="$PUBLISHABLE_KEY" \
          SUPABASE_SECRET_KEY="$SECRET_KEY" \
            npm run db:smoke -- --allow-writes

      - name: Stop Supabase
        if: always()
        run: npx supabase stop --no-backup

  test:
    name: Verification scripts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      # `test:ci` is `test` minus `test:providers`, which makes live calls to
      # Open-Meteo. A pipeline that goes red for a third party's outage gets
      # ignored, so provider connectivity stays a local/manual check.
      - name: Run verification scripts
        run: npm run test:ci

  build:
    name: Production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Reuse the Next build cache across runs on the same lockfile+source, so
      # unchanged pages are not re-rendered every time.
      - name: Restore Next.js cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**', 'next.config.ts') }}
          restore-keys: |
            next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
            next-${{ runner.os }}-

      - name: Build
        run: npm run build
        env:
          NODE_ENV: production

  # Production runs the container, not `next start`, so the image has to build
  # too. Path-filtered to keep ordinary PRs fast: only runs when something the
  # image actually depends on changed.
  docker:
    name: Container image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Values reach the shell through `env`, never interpolated into the
      # script body.
      - name: Decide whether the image needs rebuilding
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          base="$BASE_SHA"
          if git diff --name-only "$base"...HEAD \
            | grep -qE '^(Dockerfile|docker-compose\.yml|\.dockerignore|package(-lock)?\.json|next\.config\.ts|src/|public/)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No image-affecting paths changed; skipping docker build." >> "$GITHUB_STEP_SUMMARY"
          fi

      # Plain `docker build` rather than a third-party action: the runner
      # already has Docker, and this keeps the supply chain to first-party
      # actions only.
      - name: Build image
        if: steps.changes.outputs.run == 'true'
        run: |
          docker build \
            --build-arg NEXT_PUBLIC_SUPABASE_URL="$NEXT_PUBLIC_SUPABASE_URL" \
            --build-arg NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY="$NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY" \
            --tag bestcityspots:ci \
            .

      # A build that succeeds but cannot boot is not a green build. `server.js`
      # must come up and /api/health must answer; with placeholder Supabase
      # credentials the dependency check reports unhealthy (503), which is the
      # expected answer here — we are asserting the process serves traffic.
      - name: Smoke test the image
        if: steps.changes.outputs.run == 'true'
        run: |
          docker run -d --name bcs-ci -p 3000:3000 \
            -e NODE_ENV=production \
            -e HOSTNAME=0.0.0.0 \
            -e NEXT_PUBLIC_SUPABASE_URL="$NEXT_PUBLIC_SUPABASE_URL" \
            -e NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY="$NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY" \
            -e GOOGLE_PLACES_LIVE_FETCH_ENABLED=false \
            -e GOOGLE_GEMINI_LIVE_FETCH_ENABLED=false \
            bestcityspots:ci
          for attempt in $(seq 1 30); do
            code="$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/api/health || true)"
            if [ "$code" = "200" ] || [ "$code" = "503" ]; then
              echo "Container answered /api/health with HTTP $code after ${attempt}s."
              exit 0
            fi
            sleep 1
          done
          echo "Container never answered /api/health:"
          docker logs bcs-ci || true
          exit 1

      - name: Container logs on failure
        if: failure() && steps.changes.outputs.run == 'true'
        run: docker logs bcs-ci || true

      - name: Stop container
        if: always() && steps.changes.outputs.run == 'true'
        run: docker rm -f bcs-ci || true

  # Single required status check to protect the branch with: it turns red if
  # any job above failed, and stays meaningful when jobs are added or renamed.
  ci-ok:
    name: CI passed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [quality, database, test, build, docker]
    if: always()
    steps:
      - name: Check job results
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          results="$RESULTS"
          echo "Job results: $results"
          for result in $results; do
            if [ "$result" != "success" ] && [ "$result" != "skipped" ]; then
              echo "A required job did not pass."
              exit 1
            fi
          done
          echo "All required jobs passed."
