version: 2

# Sustainability, not churn: updates arrive on a predictable weekly cadence,
# grouped so one PR covers a whole ecosystem, with a cap so the queue never
# becomes something everyone ignores. Security advisories are exempt from the
# grouping and the cap — those always come through as their own PR.
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    versioning-strategy: increase
    labels:
      - dependencies
    groups:
      # Next + React + the lint config move together; splitting them produces
      # PRs that cannot pass CI on their own.
      next-react:
        patterns:
          - next
          - eslint-config-next
          - react
          - react-dom
          - "@types/react"
          - "@types/react-dom"
      # Formatter and linters: exact-pinned on purpose (a floating prettier
      # silently reformatted 38 files once), so bumps must be deliberate.
      tooling:
        patterns:
          - prettier
          - prettier-plugin-tailwindcss
          - eslint
          - eslint-*
          - typescript
          - tsx
          - "@types/node"
      styling:
        patterns:
          - tailwindcss
          - "@tailwindcss/*"
          - postcss
      # Everything else in one weekly PR: patch/minor only, so a breaking
      # major still shows up on its own and gets read.
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    labels:
      - dependencies
      - ci
    groups:
      actions:
        patterns:
          - "*"
