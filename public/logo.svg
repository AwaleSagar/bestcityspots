<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="crystalGradient" x1="256" y1="0" x2="256" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#60A5FA" /> <!-- blue-400 -->
      <stop offset="100%" stop-color="#9333EA" /> <!-- purple-600 -->
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="20" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <g filter="url(#glow)">
    <!-- Central Diamond Structure -->
    <path d="M256 64 L384 256 L256 448 L128 256 Z" fill="url(#crystalGradient)" opacity="0.9" />
    
    <!-- Facets for Depth -->
    <path d="M256 64 L384 256 L256 256 Z" fill="#FFFFFF" fill-opacity="0.2" />
    <path d="M128 256 L256 448 L256 256 Z" fill="#000000" fill-opacity="0.3" />
    
    <!-- Inner Core -->
    <path d="M256 128 L320 256 L256 384 L192 256 Z" stroke="#FFFFFF" stroke-opacity="0.5" stroke-width="4" fill="none" />
  </g>
</svg>
