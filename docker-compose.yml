services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
        GOOGLE_PLACES_API_KEY: ${GOOGLE_PLACES_API_KEY}
        GOOGLE_GEMINI_API_KEY: ${GOOGLE_GEMINI_API_KEY}
    image: bestcityspots:latest
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - HOSTNAME=0.0.0.0
      - PORT=3000
      - GOOGLE_PLACES_LIVE_FETCH_ENABLED=${GOOGLE_PLACES_LIVE_FETCH_ENABLED:-false}
      - GOOGLE_GEMINI_LIVE_FETCH_ENABLED=${GOOGLE_GEMINI_LIVE_FETCH_ENABLED:-false}
      - GOOGLE_PLACES_DAILY_CALL_LIMIT=${GOOGLE_PLACES_DAILY_CALL_LIMIT:-100}
      - GOOGLE_GEMINI_DAILY_CALL_LIMIT=${GOOGLE_GEMINI_DAILY_CALL_LIMIT:-25}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
    env_file:
      - .env.production
    restart: unless-stopped
