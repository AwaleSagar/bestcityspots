services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Paid-provider keys intentionally NOT passed at build time (incident
        # action P4): builds are cache-only, and build args leak into layers.
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
    image: bestcityspots:latest
    ports:
      - "127.0.0.1:3000:3000"
    # Bounded resources: a crawler burst degrades gracefully (slow responses,
    # 429s at nginx) instead of OOM-cycling the container — restart loops
    # previously reset the in-memory cost guard (incident root cause 3).
    mem_limit: 768m
    cpus: 1.0
    environment:
      - HOSTNAME=0.0.0.0
      - PORT=3000
      - GOOGLE_PLACES_LIVE_FETCH_ENABLED=${GOOGLE_PLACES_LIVE_FETCH_ENABLED:-false}
      - GOOGLE_GEMINI_LIVE_FETCH_ENABLED=${GOOGLE_GEMINI_LIVE_FETCH_ENABLED:-false}
      - GOOGLE_PLACES_DAILY_CALL_LIMIT=${GOOGLE_PLACES_DAILY_CALL_LIMIT:-100}
      - GOOGLE_GEMINI_DAILY_CALL_LIMIT=${GOOGLE_GEMINI_DAILY_CALL_LIMIT:-25}
      # Visitor-triggered AI generation envelope (security audit M-2).
      - AI_ON_DEMAND_DAILY_CALL_LIMIT=${AI_ON_DEMAND_DAILY_CALL_LIMIT:-5}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
    env_file:
      - .env.production
    restart: unless-stopped
