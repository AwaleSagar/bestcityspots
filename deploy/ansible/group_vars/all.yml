---
# Non-secret configuration. Secrets live in vault.yml (ansible-vault encrypted).

app_user: "deploy"
app_dir: "/opt/bestcityspots"
compose_project: "bestcityspots"

# The repository is public, so the host clones over HTTPS with no deploy key.
app_repo: "https://github.com/AwaleSagar/bestcityspots.git"

# app_version is intentionally NOT set here — pass a pinned tag/SHA on the CLI:
#   -e app_version=v1.4.2
# (the playbook refuses moving refs like 'main' unless -e allow_unpinned=true)

# ── Cost guardrails: production-safe defaults (cache-only) ────────────────
places_live_fetch: "false"
gemini_live_fetch: "false"
places_daily_limit: "100"
gemini_daily_limit: "25"
ai_on_demand_daily_limit: "5"
warm_places_budget: "300"
warm_gemini_budget: "100"
ai_provider: "openai"
log_level: "info"

# ── TLS ───────────────────────────────────────────────────────────────────
enable_tls: false            # flip to true once DNS A/AAAA records resolve
letsencrypt_email: ""

warm_cache_cron: true

# ── SSH ───────────────────────────────────────────────────────────────────
# Public key installed for the deploy user; password logins are then turned
# off (the playbook refuses if the connecting account has no key).
ssh_harden: true
ssh_public_key_file: "~/.ssh/id_ed25519.pub"
