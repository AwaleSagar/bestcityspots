# Copy to inventory.ini and fill in your host. Keep inventory.ini gitignored.
#
# Fresh Hostinger/VPS images only have `root`. Install your key first:
#   ssh-copy-id -i ~/.ssh/id_ed25519.pub root@<server-ip>
# The first run connects as root (by key); the playbook then creates the
# unprivileged `deploy` user and switches SSH to key-only logins.
[bestcityspots_prod]
prod1 ansible_host=YOUR.SERVER.IP.HERE

[bestcityspots_prod:vars]
ansible_user=root
ansible_ssh_private_key_file=~/.ssh/id_ed25519
ansible_python_interpreter=/usr/bin/python3
