# bestcityspots — edge defense (incident action P3)
#
# Install: copy to /etc/nginx/ and include from the main config, or merge the
# `http`-level blocks into /etc/nginx/nginx.conf and the `server` block into
# the existing site. Then: nginx -t && systemctl reload nginx
#
# Purpose: hostile or runaway crawler traffic must be absorbed HERE, before it
# reaches Next.js SSR. The app's cost guard makes paid-API spend impossible to
# exceed; this layer keeps CPU/DB load and 5xx churn down so the site degrades
# gracefully (429s) instead of melting.

# ─────────────────────────── http-level blocks ───────────────────────────

# Per-IP budgets. Tune from access-log percentiles; current numbers assume a
# human browses < 10 SSR pages/minute and the API is called by our own pages.
limit_req_zone $binary_remote_addr zone=bcs_pages:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=bcs_api:10m   rate=30r/m;
limit_req_zone $binary_remote_addr zone=bcs_global:10m rate=60r/m;
limit_conn_zone $binary_remote_addr zone=bcs_conn:10m;
limit_req_status 429;
limit_conn_status 429;

# Bots that ignore robots.txt get a hard 403. Verified search engines
# (Googlebot/Bingbot) are intentionally NOT in this list — they honor
# robots.txt and matter for SEO; they are rate-limited like everyone else.
map $http_user_agent $bcs_blocked_bot {
    default 0;
    "~*(GPTBot|ChatGPT-User|CCBot|anthropic-ai|ClaudeBot|PerplexityBot)" 1;
    "~*(Bytespider|PetalBot|Amazonbot|Diffbot|DataForSeoBot|ImagesiftBot)" 1;
    "~*(SemrushBot|AhrefsBot|MJ12bot|DotBot|BLEXBot|serpstatbot)" 1;
    "~*(python-requests|python-urllib|aiohttp|httpx|scrapy|go-http-client|java/|libwww)" 1;
    "~*^(curl|wget)" 1;
    ""  1;   # empty User-Agent
}

# ───────────────────────────── server block ──────────────────────────────

server {
    listen 80;
    listen [::]:80;
    server_name bestcityspots.com www.bestcityspots.com;
    # (TLS via certbot: listen 443 ssl; ssl_certificate ...; unchanged here.)

    # Hard block before any proxying.
    if ($bcs_blocked_bot) {
        return 403;
    }

    # Site-wide safety net (catches distributed path scans).
    limit_req zone=bcs_global burst=30 nodelay;
    limit_conn bcs_conn 20;

    # Crawl-amplification surface: SSR city pages. Tightest budget.
    location ~ ^/(cities|countries|best-cities) {
        limit_req zone=bcs_pages burst=20 nodelay;
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/snippets/bestcityspots-proxy.conf;
    }

    location /api/ {
        limit_req zone=bcs_api burst=10 nodelay;
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/snippets/bestcityspots-proxy.conf;
    }

    # Static assets are cheap — no limit_req beyond the global net.
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/snippets/bestcityspots-proxy.conf;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        limit_req zone=bcs_pages burst=20 nodelay;
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/snippets/bestcityspots-proxy.conf;
    }
}

