<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Best City Spots — Under Maintenance</title>
  <meta name="description" content="Best City Spots is currently undergoing scheduled maintenance. We'll be back shortly." />
  <meta name="robots" content="noindex, nofollow" />
  <style>
    *,
    *::before,
    *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg-primary: #0a0e1a;
      --bg-secondary: #111827;
      --glass-bg: rgba(255, 255, 255, 0.04);
      --glass-border: rgba(255, 255, 255, 0.08);
      --glass-highlight: rgba(255, 255, 255, 0.12);
      --text-primary: #f1f5f9;
      --text-secondary: #94a3b8;
      --accent-1: #6366f1;
      --accent-2: #8b5cf6;
      --accent-3: #a78bfa;
      --glow-1: rgba(99, 102, 241, 0.3);
      --glow-2: rgba(139, 92, 246, 0.2);
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    /* Animated background orbs */
    .bg-orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.5;
      animation: float 12s ease-in-out infinite;
      pointer-events: none;
    }

    .bg-orb--1 {
      width: 400px;
      height: 400px;
      background: var(--glow-1);
      top: -10%;
      left: -5%;
      animation-delay: 0s;
    }

    .bg-orb--2 {
      width: 350px;
      height: 350px;
      background: var(--glow-2);
      bottom: -10%;
      right: -5%;
      animation-delay: -4s;
    }

    .bg-orb--3 {
      width: 250px;
      height: 250px;
      background: rgba(167, 139, 250, 0.15);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      animation-delay: -8s;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0) scale(1); }
      33% { transform: translateY(-30px) scale(1.05); }
      66% { transform: translateY(20px) scale(0.95); }
    }

    /* Glass card */
    .card {
      position: relative;
      z-index: 1;
      max-width: 520px;
      width: 90%;
      padding: 48px 40px;
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-radius: 24px;
      backdrop-filter: blur(24px) saturate(1.4);
      -webkit-backdrop-filter: blur(24px) saturate(1.4);
      box-shadow:
        0 0 0 1px var(--glass-highlight) inset,
        0 24px 48px rgba(0, 0, 0, 0.4),
        0 0 80px var(--glow-1);
      text-align: center;
      animation: cardEntry 0.8s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    @keyframes cardEntry {
      from {
        opacity: 0;
        transform: translateY(30px) scale(0.96);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    /* Animated icon */
    .icon-wrap {
      width: 80px;
      height: 80px;
      margin: 0 auto 28px;
      background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: pulse 3s ease-in-out infinite;
      box-shadow: 0 8px 32px var(--glow-1);
    }

    @keyframes pulse {
      0%, 100% { box-shadow: 0 8px 32px var(--glow-1); }
      50% { box-shadow: 0 8px 48px var(--glow-1), 0 0 60px var(--glow-2); }
    }

    .icon-wrap svg {
      width: 40px;
      height: 40px;
      stroke: white;
      stroke-width: 1.5;
      fill: none;
    }

    h1 {
      font-size: 1.75rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 12px;
      background: linear-gradient(135deg, var(--text-primary), var(--accent-3));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .subtitle {
      font-size: 1rem;
      color: var(--text-secondary);
      line-height: 1.6;
      margin-bottom: 32px;
    }

    /* Progress bar */
    .progress-track {
      width: 100%;
      height: 4px;
      background: var(--glass-border);
      border-radius: 4px;
      overflow: hidden;
      margin-bottom: 28px;
    }

    .progress-bar {
      height: 100%;
      width: 30%;
      border-radius: 4px;
      background: linear-gradient(90deg, var(--accent-1), var(--accent-2), var(--accent-3));
      animation: progress 2.5s ease-in-out infinite;
    }

    @keyframes progress {
      0% { width: 10%; margin-left: 0; }
      50% { width: 40%; margin-left: 30%; }
      100% { width: 10%; margin-left: 90%; }
    }

    /* Countdown */
    .countdown {
      display: flex;
      justify-content: center;
      gap: 16px;
      margin-bottom: 32px;
    }

    .countdown__block {
      display: flex;
      flex-direction: column;
      align-items: center;
      min-width: 60px;
    }

    .countdown__value {
      font-size: 2rem;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      color: var(--text-primary);
      line-height: 1;
    }

    .countdown__label {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-secondary);
      margin-top: 6px;
    }

    .countdown__sep {
      font-size: 2rem;
      font-weight: 300;
      color: var(--text-secondary);
      line-height: 1;
      opacity: 0.4;
    }

    /* Status badge */
    .status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      background: rgba(99, 102, 241, 0.1);
      border: 1px solid rgba(99, 102, 241, 0.2);
      border-radius: 999px;
      font-size: 0.8rem;
      color: var(--accent-3);
      letter-spacing: 0.02em;
    }

    .status__dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent-2);
      animation: blink 1.5s ease-in-out infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    /* Footer text */
    .footer {
      margin-top: 24px;
      font-size: 0.75rem;
      color: var(--text-secondary);
      opacity: 0.6;
    }

    .footer a {
      color: var(--accent-3);
      text-decoration: none;
    }

    .footer a:hover {
      text-decoration: underline;
    }

    /* Responsive */
    @media (max-width: 480px) {
      .card {
        padding: 36px 24px;
      }

      h1 {
        font-size: 1.4rem;
      }

      .countdown__value {
        font-size: 1.5rem;
      }

      .countdown__block {
        min-width: 48px;
      }
    }
  </style>
</head>
<body>

  <!-- Background orbs -->
  <div class="bg-orb bg-orb--1"></div>
  <div class="bg-orb bg-orb--2"></div>
  <div class="bg-orb bg-orb--3"></div>

  <!-- Main card -->
  <div class="card">
    <div class="icon-wrap">
      <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
        <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/>
      </svg>
    </div>

    <h1>We&rsquo;ll Be Right Back</h1>
    <p class="subtitle">
      Best City Spots is undergoing scheduled maintenance to bring you an even better experience. Hang tight!
    </p>

    <div class="progress-track">
      <div class="progress-bar"></div>
    </div>

    <div class="countdown" id="countdown">
      <div class="countdown__block">
        <span class="countdown__value" id="cd-hours">00</span>
        <span class="countdown__label">Hours</span>
      </div>
      <span class="countdown__sep">:</span>
      <div class="countdown__block">
        <span class="countdown__value" id="cd-minutes">00</span>
        <span class="countdown__label">Minutes</span>
      </div>
      <span class="countdown__sep">:</span>
      <div class="countdown__block">
        <span class="countdown__value" id="cd-seconds">00</span>
        <span class="countdown__label">Seconds</span>
      </div>
    </div>

    <div class="status">
      <span class="status__dot"></span>
      Maintenance in progress
    </div>

    <p class="footer">
      &copy; <span id="year"></span> Best City Spots &mdash;
      <a href="mailto:support@bestcityspots.com">Contact Support</a>
    </p>
  </div>

  <script>
    (function () {
      // Set current year
      document.getElementById('year').textContent = new Date().getFullYear();

      // Countdown: default 2 hours from now (adjust as needed)
      var MAINTENANCE_DURATION_MS = 2 * 60 * 60 * 1000;
      var storageKey = 'bcs_maintenance_end';
      var endTime;

      try {
        var stored = localStorage.getItem(storageKey);
        if (stored && Number(stored) > Date.now()) {
          endTime = Number(stored);
        }
      } catch (e) {
        // localStorage unavailable
      }

      if (!endTime) {
        endTime = Date.now() + MAINTENANCE_DURATION_MS;
        try {
          localStorage.setItem(storageKey, String(endTime));
        } catch (e) {
          // ignore
        }
      }

      var hoursEl = document.getElementById('cd-hours');
      var minutesEl = document.getElementById('cd-minutes');
      var secondsEl = document.getElementById('cd-seconds');

      function pad(n) {
        return n < 10 ? '0' + n : String(n);
      }

      function tick() {
        var remaining = Math.max(0, endTime - Date.now());
        var totalSeconds = Math.floor(remaining / 1000);
        var h = Math.floor(totalSeconds / 3600);
        var m = Math.floor((totalSeconds % 3600) / 60);
        var s = totalSeconds % 60;

        hoursEl.textContent = pad(h);
        minutesEl.textContent = pad(m);
        secondsEl.textContent = pad(s);

        if (remaining <= 0) {
          try { localStorage.removeItem(storageKey); } catch (e) {}
          window.location.reload();
        }
      }

      tick();
      setInterval(tick, 1000);
    })();
  </script>
</body>
</html>
