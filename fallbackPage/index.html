<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Best City Spots — We'll be right back</title>
    <meta
      name="description"
      content="Best City Spots is undergoing brief scheduled maintenance. We'll be back shortly."
    />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#14181f" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#fbf7f2" media="(prefers-color-scheme: light)" />
    <style>
      *,
      *::before,
      *::after {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      :root {
        /* Spacing scale (4px base) */
        --s-1: 4px;
        --s-2: 8px;
        --s-3: 12px;
        --s-4: 16px;
        --s-6: 24px;
        --s-8: 32px;
        --s-10: 40px;
        --s-16: 64px;

        /* Azure Atlas — dark canvas (cool charcoal, hue ~250) */
        --bg: #14181f;
        --bg-wash: #1b212b;
        --border: rgba(255, 255, 255, 0.08);
        --text: #eef1f5;
        --text-muted: #9aa4b2;
        --accent: #e8543f; /* Coral Spark */
        --accent-soft: rgba(232, 84, 63, 0.13);
        --accent-ring: rgba(232, 84, 63, 0.3);
        --focus: #4a9fcf; /* Deep Azure, lightened for dark */
      }

      @media (prefers-color-scheme: light) {
        :root {
          --bg: #fbf7f2;
          --bg-wash: #f3ece2;
          --border: rgba(20, 24, 31, 0.09);
          --text: #1c2128;
          --text-muted: #5c6675;
          --accent: #c2402e; /* Clay Press — stronger for light contrast */
          --accent-soft: rgba(194, 64, 46, 0.09);
          --accent-ring: rgba(194, 64, 46, 0.22);
          --focus: #15608a; /* Deep Azure */
        }
      }

      @media (prefers-contrast: more) {
        :root {
          --border: currentColor;
          --text-muted: var(--text);
        }
      }

      html {
        -webkit-text-size-adjust: 100%;
      }

      body {
        /* System-first: honest, instant, zero font bytes */
        font-family:
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Roboto,
          "Helvetica Neue",
          Arial,
          sans-serif;
        background-color: var(--bg);
        /* Static, GPU-cheap gradient wash — no blurred decorative layers */
        background-image:
          radial-gradient(120% 90% at 15% 0%, var(--bg-wash) 0%, transparent 55%),
          radial-gradient(100% 80% at 100% 100%, var(--accent-soft) 0%, transparent 60%);
        color: var(--text);
        min-height: 100vh;
        min-height: 100svh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: clamp(var(--s-6), 6vw, var(--s-10));
        line-height: 1.6;
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
      }

      main {
        width: 100%;
        max-width: 30rem;
        text-align: center;
        animation: rise 0.6s cubic-bezier(0.16, 1, 0.3, 1) both;
      }

      @keyframes rise {
        from {
          opacity: 0;
          transform: translateY(12px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      /* The single accent moment: the brand mark */
      .mark {
        width: 56px;
        height: 56px;
        margin: 0 auto var(--s-8);
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 16px;
        color: var(--accent);
        background: var(--accent-soft);
        box-shadow: 0 0 0 1px var(--accent-ring) inset;
      }

      .mark svg {
        width: 28px;
        height: 28px;
        stroke: currentColor;
        stroke-width: 1.6;
        fill: none;
      }

      .eyebrow {
        font-size: 0.75rem;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.16em;
        color: var(--text-muted);
        margin-bottom: var(--s-3);
      }

      h1 {
        font-size: clamp(2rem, 6vw, 2.75rem);
        font-weight: 600;
        line-height: 1.1;
        letter-spacing: -0.01em;
        color: var(--text);
        text-wrap: balance;
      }

      .lede {
        margin: var(--s-4) auto 0;
        max-width: 36rem;
        font-size: 1.0625rem;
        color: var(--text-muted);
        text-wrap: pretty;
      }

      /* Quiet status — a label, not a badge */
      .status {
        display: inline-flex;
        align-items: center;
        gap: var(--s-2);
        margin-top: var(--s-8);
        font-size: 0.8125rem;
        font-weight: 500;
        color: var(--text-muted);
      }

      .status__dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--accent);
        animation: pulse 2.4s ease-in-out infinite;
      }

      @keyframes pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.55;
        }
      }

      footer {
        margin-top: var(--s-10);
        padding-top: var(--s-6);
        border-top: 1px solid var(--border);
        font-size: 0.8125rem;
        color: var(--text-muted);
      }

      footer a {
        display: inline-block;
        padding: 10px var(--s-2); /* ≥44px tap target height */
        margin: -10px calc(-1 * var(--s-2));
        color: var(--accent);
        text-decoration: none;
        font-weight: 500;
        border-radius: 6px;
      }

      footer a:hover {
        text-decoration: underline;
      }

      a:focus-visible {
        outline: 2px solid var(--focus);
        outline-offset: 3px;
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation: none !important;
          transition: none !important;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 21s-7-4.35-7-10a7 7 0 0 1 14 0c0 5.65-7 10-7 10z" />
          <circle cx="12" cy="11" r="2.5" />
        </svg>
      </div>

      <p class="eyebrow">Best City Spots</p>
      <h1>We&rsquo;ll be right back</h1>
      <p class="lede">
        We&rsquo;re making a few quick improvements. The site will be back online shortly &mdash;
        thanks for your patience.
      </p>

      <p class="status" role="status" aria-live="polite">
        <span class="status__dot" aria-hidden="true"></span>
        Scheduled maintenance in progress
      </p>

      <footer>
        &copy; 2026 Best City Spots &middot;
        <a href="mailto:support@bestcityspots.com">Contact support</a>
      </footer>
    </main>
  </body>
</html>
